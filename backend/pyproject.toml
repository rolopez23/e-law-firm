[project]
name = "e-law-firm-backend"
version = "0.1.0"
description = "FastAPI backend for e-law-firm"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: needs a reachable Postgres at TEST_DATABASE_URL (skipped otherwise)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
